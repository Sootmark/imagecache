[package]
name = "sootmark-imagecache"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows image caches for forensics: Explorer's thumbcache and iconcache databases (every thumbnail with its cache id, checksums and image bytes) and the RDP bitmap cache (every tile as BGRA pixels)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/imagecache"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "thumbcache", "rdp", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "imagecache"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
